    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --th-bg: #f8fafc;
            --th-text: #64748b;
            /* Updated Brand Color: Premium Ruby Red (Matches TCN Logo) */
            --accent-primary: #e11d48; 
            --accent-hover: #be123c;
            --row-hover: #f1f5f9;
            --ring-border: rgba(225, 29, 72, 0.25);
            --ring-shadow: 0 0 0 2px rgba(225, 29, 72, 0.15);
        }
        [data-theme="dark"] {
            --bg-body: #070a12;
            --bg-surface: #0b1120;
            --header-bg: rgba(11, 17, 32, 0.95);
            --border-color: #1e293b;
            --text-heading: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
            --th-bg: #0f172a;
            --th-text: #94a3b8;
            /* Dark mode keeps the glowing bright Ruby Red */
            --accent-primary: #f43f5e; 
            --accent-hover: #e11d48;
            --row-hover: #131c31;
            --ring-border: rgba(244, 63, 94, 0.35);
            --ring-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
        body { background: var(--bg-body); color: var(--text-body); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        
        /* --- Updated Header Layout --- */
        header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 12px 0 0 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
        .header-inner { width: 92%; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        
        .logo-box { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background: var(--bg-surface);
            border: 1.5px solid var(--accent-primary);
            box-shadow: 0 2px 8px rgba(225, 29, 72, 0.3); 
            flex-shrink: 0; 
            padding: 1px;
        }
        .logo-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .logo-text h1 { font-size: 17px; color: var(--text-heading); font-weight: 800; line-height: 1.1; white-space: nowrap; }
        .logo-text span { font-size: 11px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
        .logo-text b { color: var(--accent-primary); }
        
        /* --- New Premium Horizontal Tabs --- */
        .tab-switcher { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            white-space: nowrap; 
            padding-bottom: 12px; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; 
            width: 100%;
        }
        .tab-switcher::-webkit-scrollbar { display: none; }
        
        .tab-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 8px 18px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-surface); 
            color: var(--text-muted); 
            font-weight: 700; 
            font-size: 13px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.2s; 
            flex-shrink: 0; 
        }
        /* Crisp SVG Icons inside buttons */
        .tab-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        
        .tab-btn.active { 
            background: var(--accent-primary); 
            color: white; 
            border-color: var(--accent-primary); 
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); 
        }
        
        /* Header Controls */
        .lang-select { background: transparent; border: 1px solid var(--border-color); color: var(--text-heading); padding: 5px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; outline: none; cursor: pointer; }
        .theme-toggle-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-heading); padding: 4px; display: flex; align-items: center; justify-content: center; }
        .join-btn { background: var(--accent-primary); color: white; text-decoration: none; padding: 7px 14px; border-radius: 16px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25); white-space: nowrap; }
        .join-btn:hover { background: var(--accent-hover); }
        
        /* Container */
        .container { width: 92%; max-width: 1240px; margin: 0 auto; padding: 28px 0; flex: 1; }
        
        .hero-title h2 { font-size: 26px; color: var(--text-heading); margin-bottom: 4px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;}
        .hero-title h2 svg { width: 24px; height: 24px; stroke: var(--accent-primary); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .hero-title p { color: var(--text-muted); font-weight: 500; font-size: 13px; }
        
        /* Filters */
        .filter-section { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 16px; gap: 12px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 260px; max-width: 360px; }
        .search-box input { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-heading); outline: none; font-weight: 500; font-size: 13px; }
        .search-box input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15); }
        
        .filter-buttons { display: flex; gap: 8px; align-items: center; }
        .btn-filter { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 12px; white-space: nowrap; transition: all 0.2s; }
        .btn-filter.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25); }
        
        .cat-select { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 12px; outline: none; }
        
        /* Table Card */
        .table-card { background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 4px 24px -4px rgba(0,0,0,0.03); }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 650px; }
        th { background: var(--th-bg); padding: 13px 20px; font-size: 11px; color: var(--th-text); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--border-color); vertical-align: middle; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: var(--row-hover); }
        
        .project-cell { display: flex; align-items: center; gap: 12px; }
        
        /* Ring styling for logo avatar */
        .project-avatar-box { 
            width: 38px; height: 38px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-shrink: 0; 
            background: var(--bg-surface); border: 1.5px solid var(--ring-border); box-shadow: var(--ring-shadow); padding: 2px;

        .project-initial { width: 100%; height: 100%; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 14px; color: white; }
        
        .project-name { font-weight: 700; color: var(--text-heading); display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .project-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; font-weight: 500;}

        .category-pill { background: var(--bg-body); padding: 4px 10px; border-radius: 6px; font-size: 11px; color: var(--text-muted); font-weight: 700; border: 1px solid var(--border-color); display: inline-block; }
        .score-text { font-weight: 800; color: var(--accent-primary); font-size: 13px; }
        
        .btn-details { background: transparent; border: 1.5px solid var(--accent-primary); color: var(--accent-primary); padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 700; display: inline-block; transition: all 0.2s; white-space: nowrap; }
        .btn-details:hover { background: var(--accent-primary); color: white; box-shadow: 0 2px 8px rgba(225, 29, 72, 0.3); }

        .footer-content { width: 92%; max-width: 1240px; margin: 0 auto; }
        .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 10px; font-size: 12px; font-weight: 600; }
        .footer-links a:hover { color: var(--accent-primary); }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .header-inner { gap: 12px; width: 94%; }
            .logo-text h1 { font-size: 16px; }
            .container { width: 94%; padding: 18px 0; }

            .search-box { max-width: 100%; min-width: 100%; }

            .filter-buttons::-webkit-scrollbar { display: none; }
            
            th, td { padding: 10px 14px; }
            .btn-details { padding: 6px 12px; font-size: 11px; }

</head>

        let currentFilter = 'All';
        let currentSubCategory = 'All';

        function getAvatarColor(name) {
            /* Updated #e11d48 here so logo initials match the new ruby red theme */
            const colors = ['#e11d48', '#059669', '#2563eb', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e', '#f59e0b', '#14b8a6'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        function switchMainTab(btnElement, tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            const titleElement = document.getElementById('mainPageTitle');
            const svgIcon = btnElement.querySelector('svg').outerHTML;
            titleElement.innerHTML = `${svgIcon} ${tabName}`;
            
            if(tabName === 'DePIN Projects') {
                document.querySelector('.filter-section').style.display = 'flex';
                document.querySelector('.table-card').style.display = 'block';
                renderTable();
            } else {
                document.getElementById('projectsTableBody').innerHTML = '';
                document.querySelector('.filter-section').style.display = 'none'; 
                document.getElementById('noDataMessage').style.display = 'block';
                document.getElementById('noDataMessage').innerText = `🚀 ${tabName} data is coming soon!`;
                document.getElementById('projectCount').innerText = `0 verified projects`;
            }
        }

        function renderTable() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('projectsTableBody');
            const noDataMsg = document.getElementById('noDataMessage');
            tbody.innerHTML = '';
            let visibleCount = 0;

            ALL_PROJECTS.forEach(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                
                let matchesFilter = false;
                if(currentFilter === 'All') {
                    matchesFilter = true;
                } else if(currentFilter === 'No Token') {
                    matchesFilter = p.status === 'No Token';
                } else {
                    matchesFilter = p.status === currentFilter;
                }
                
                const matchesSubCat = currentSubCategory === 'All' || p.category.includes(currentSubCategory);

                if (matchesSearch && matchesFilter && matchesSubCat) {
                    visibleCount++;
                    const initial = p.name.charAt(0).toUpperCase();
                    const bgColor = getAvatarColor(p.name);
                    const targetLink = p.link ? p.link : '#';
                    
                    let avatarHtml = '';
                    if (p.logo) {
                        avatarHtml = `<div class="project-avatar-box"><img src="${p.logo}" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="project-initial" style="background: ${bgColor}; display:none;">${initial}</div></div>`;
                    } else {
                        avatarHtml = `<div class="project-avatar-box"><div class="project-initial" style="background: ${bgColor};">${initial}</div></div>`;
                    }

                    let verifiedBadge = p.verified ? `<span class="verified-tick" title="Verified TCN Project">✓</span>` : '';

                    let statusBadge = '';
                    if(p.status === "Token Listed" && currentFilter === "Token Listed") {
                        statusBadge = `<span class="badge-listed">Token Listed</span>`;
                    } else if(p.status === "Cash Payouts" && currentFilter === "Cash Payouts") {
                        statusBadge = `<span class="badge-listed" style="color:#10b981; border-color:rgba(16,185,129,0.25); background:rgba(16,185,129,0.1);">USD Pay</span>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div class="project-cell">
                                ${avatarHtml}
                                <div>
                                    <div class="project-name">${p.name} ${verifiedBadge} ${statusBadge}</div>
                                    <div class="project-sub">${p.sub}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="category-pill">${p.category}</span></td>
                        <td class="score-text">${p.score}</td>
                        <td><a href="${targetLink}" class="btn-details">View Details</a></td>
                    `;
                    tbody.appendChild(row);
                }
            });

            document.getElementById('projectCount').innerText = `Showing ${visibleCount} verified DePIN projects`;
            noDataMsg.style.display = visibleCount === 0 ? "block" : "none";
        }

        function setCategory(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons .btn-filter').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderTable();
        }

        function setSubCategory(cat) {
            currentSubCategory = cat;
            renderTable();
        }

        function toggleTheme() {
            const body = document.body;
            const toggleBtn = document.getElementById('themeToggle');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'light' ? '🌙' : '☀️';
            renderTable();
        };
