<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCN Hub | by Total Crypto Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* TCN HUB - PREMIUM TEAL THEME (ALL-IN-ONE) */
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.96);
            --border-color: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --th-bg: #f1f5f9;
            --th-text: #475569;
            --accent-primary: #0d9488; 
            --accent-hover: #0f766e;
        }
        [data-theme="dark"] {
            --bg-body: #090d16;
            --bg-surface: #0f172a;
            --header-bg: rgba(15, 23, 42, 0.96);
            --border-color: #1e293b;
            --text-heading: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
            --th-bg: #141f36;
            --th-text: #94a3b8;
            --accent-primary: #14b8a6; 
            --accent-hover: #0d9488;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.2s, color 0.2s; }
        body { background: var(--bg-body); color: var(--text-body); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-left, .header-right { display: flex; align-items: center; gap: 24px; }
        .logo-box { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 42px; height: 42px; background: var(--accent-primary); border-radius: 12px; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
        .logo-text h1 { font-size: 20px; color: var(--text-heading); font-weight: 800; line-height: 1.1; }
        .logo-text span { font-size: 12px; color: var(--text-muted); font-weight: 500;}
        .logo-text b { color: var(--accent-primary); }
        
        /* Tab Switcher in Header */
        .tab-switcher { display: flex; background: var(--th-bg); border-radius: 10px; padding: 5px; border: 1px solid var(--border-color); }
        .tab-btn { padding: 8px 18px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 14px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: var(--bg-surface); color: var(--accent-primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* Header Controls */
        .lang-select { background: transparent; border: 1px solid var(--border-color); color: var(--text-heading); padding: 6px 12px; border-radius: 8px; font-weight: 600; outline: none; cursor: pointer; }
        .theme-toggle-btn { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-heading); }
        .join-btn { background: var(--accent-primary); color: white; text-decoration: none; padding: 9px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .join-btn:hover { background: var(--accent-hover); }
        
        /* Main Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; }
        .hero-title h2 { font-size: 32px; color: var(--text-heading); margin-bottom: 5px; font-weight: 800;}
        .hero-title p { color: var(--text-muted); font-weight: 500; font-size: 14px; }
        
        /* Filters */
        .filter-section { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 20px; gap: 15px; flex-wrap: wrap; }
        .search-box input { width: 300px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-heading); outline: none; font-weight: 500; }
        .search-box input:focus { border-color: var(--accent-primary); }
        .filter-buttons { display: flex; gap: 8px; align-items: center;}
        .btn-filter { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-filter.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        .cat-select { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 13px; outline: none; margin-left: 5px;}
        
        /* Table */
        .table-card { background: var(--bg-surface); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--th-bg); padding: 16px 24px; font-size: 12px; color: var(--th-text); font-weight: 800; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        tr:hover { background: var(--bg-body); }
        
        .project-cell { display: flex; align-items: center; gap: 15px; }
        .project-avatar { width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 16px; flex-shrink: 0;}
        .project-name { font-weight: 700; color: var(--text-heading); display: flex; align-items: center; gap: 10px; font-size: 15px; }
        .project-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500;}
        
        .badge-listed { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .category-pill { background: var(--bg-body); padding: 6px 14px; border-radius: 8px; font-size: 12px; color: var(--text-muted); font-weight: 700; border: 1px solid var(--border-color); }
        .score-text { font-weight: 800; color: var(--accent-primary); font-size: 14px; }
        
        .btn-details { background: transparent; border: 1.5px solid var(--accent-primary); color: var(--accent-primary); padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; display: inline-block;}
        .btn-details:hover { background: var(--accent-primary); color: white; }
        
        footer { padding: 25px; text-align: center; border-top: 1px solid var(--border-color); margin-top: auto; background: var(--bg-surface);}
        .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 12px; font-size: 13px; font-weight: 600; }
        .footer-links a:hover { color: var(--accent-primary); }

        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .filter-section { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            th, td { padding: 15px; }
        }
    </style>
</head>
<body data-theme="light">

                    <option value="Compute">Compute</option>
                    <option value="Mobile">Mobile</option>
                    <option value="Storage">Storage</option>

            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <table>

            </table>
            <div id="noDataMessage" style="display:none; padding: 40px; text-align: center; color: var(--text-muted); font-weight: 600;">
                No project found. We only list verified nodes.

    </div>

    <!-- Footer -->

            &copy; 2026 Total Crypto Network. All rights reserved.
        </div>
        <div class="footer-links">
            <a href="pages/about.html">About Us</a>
            <a href="pages/privacy.html">Privacy Policy</a>
            <a href="pages/disclaimer.html">Disclaimer</a>
        </div>
    </footer>

            { name: "Swash", sub: "Data Monetization", category: "Bandwidth", status: "Token Listed", score: "⭐ 8.5 / 10", link: "#" },
            { name: "Brevo", sub: "Ads Network", category: "Bandwidth", status: "No Token", score: "⭐ 7.5 / 10", link: "#" },
            { name: "Perceptron Network", sub: "AI Infrastructure", category: "Compute", status: "No Token", score: "⭐ 8.7 / 10", link: "#" },
            { name: "Bless Network", sub: "AI Extension", category: "Compute", status: "No Token", score: "⭐ 8.5 / 10", link: "#" },
            { name: "Optimai", sub: "AI Infrastructure", category: "Compute", status: "No Token", score: "⭐ 8.1 / 10", link: "#" },
            { name: "MinionLab", sub: "Data Processing", category: "Compute", status: "No Token", score: "⭐ 8.0 / 10", link: "#" },
            { name: "COIN App", sub: "Geo Location (XYO)", category: "Mobile", status: "Token Listed", score: "⭐ 8.5 / 10", link: "#" },
            { name: "U2DPN", sub: "Mobile Bandwidth", category: "Mobile", status: "No Token", score: "⭐ 8.0 / 10", link: "#" },
            { name: "PacketStream", sub: "PC Bandwidth", category: "Bandwidth", status: "No Token", score: "⭐ 7.9 / 10", link: "#" }
        ];

        let currentFilter = 'All';
        let currentSubCategory = 'All';

        function getAvatarColor(name) {
            const colors = ['#0d9488', '#059669', '#2563eb', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e', '#f59e0b', '#ef4444'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        function renderTable() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('projectsTableBody');
            const noDataMsg = document.getElementById('noDataMessage');
            tbody.innerHTML = '';
            let visibleCount = 0;

            // Sort projects alphabetically
            const sortedProjects = ALL_PROJECTS.sort((a, b) => a.name.localeCompare(b.name));

            sortedProjects.forEach(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                const matchesFilter = currentFilter === 'All' || p.status === currentFilter;
                const matchesSubCat = currentSubCategory === 'All' || p.category === currentSubCategory;

                if (matchesSearch && matchesFilter && matchesSubCat) {
                    visibleCount++;
                    const initial = p.name.charAt(0).toUpperCase();
                    const bgColor = getAvatarColor(p.name);
                    const targetLink = p.link ? p.link : '#';
                    
                    // बैज (Badge) सिर्फ तभी दिखेगा जब 'Token Listed' बटन सेलेक्टेड हो
                    let statusBadge = (p.status === "Token Listed" && currentFilter === "Token Listed") ? `<span class="badge-listed">Token Listed</span>` : '';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div class="project-cell">
                                <div class="project-avatar" style="background: ${bgColor};">${initial}</div>
                                <div>
                                    <div class="project-name">${p.name} ${statusBadge}</div>
                                    <div class="project-sub">${p.sub}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="category-pill">${p.category}</span></td>
                        <td class="score-text">${p.score}</td>
                        <td><a href="${targetLink}" class="btn-details">View Details</a></td>
                    `;
                    tbody.appendChild(row);
                }
            });

            document.getElementById('projectCount').innerText = `Showing ${visibleCount} verified DePIN projects`;
            noDataMsg.style.display = visibleCount === 0 ? "block" : "none";
        }

        function setCategory(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons .btn-filter').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderTable();
        }

        function setSubCategory(cat) {
            currentSubCategory = cat;
            renderTable();
        }

        function toggleTheme() {
            const body = document.body;
            const toggleBtn = document.getElementById('themeToggle');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'light' ? '🌙' : '☀️';
            renderTable();
        };
    </script>
