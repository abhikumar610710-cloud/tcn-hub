<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCN Hub | by Total Crypto Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="#" class="logo-box">
                <div class="logo-icon">TCN</div>
                <div class="logo-text">
                    <h1>TCN Hub</h1>
                    <span>by <b>Total Crypto Network</b></span>
                </div>
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link active">DePIN Projects</a>
                <a href="#" class="nav-link">Token Checker</a>
            </div>
        </div>
        <div class="header-right">
            <!-- Language Dropdown -->
            <select class="lang-select" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-heading); padding: 5px 10px; border-radius: 6px; font-weight: 600; margin-right: 10px; outline: none; cursor: pointer;">
                <option value="en">EN</option>
                <option value="hi">HI</option>
            </select>
            
            <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="मोड बदलें">🌙</button>
            <a href="https://t.me/" target="_blank" class="join-btn">⚡ Join TCN AI</a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-title-box">
            <div>
                <h2>DePIN Projects</h2>
                <div class="hero-subtitle" id="projectCount">Loading projects...</div>
            </div>
        </div>

        <!-- Search & Filters -->
        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search projects..." onkeyup="renderTable()">
            </div>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setCategory('All', this)">All Projects</button>
                <button class="btn-filter" onclick="setCategory('Token Listed', this)">Token Listed</button>
                <button class="btn-filter" onclick="setCategory('No Token', this)">No Token</button>
                
                <!-- Category Dropdown -->
                <select class="btn-filter" onchange="setSubCategory(this.value)" style="margin-left: 10px; outline: none; cursor: pointer;">
                    <option value="All">Categories</option>
                    <option value="Bandwidth">Bandwidth</option>
                    <option value="Compute">Compute</option>
                    <option value="Mobile">Mobile</option>
                </select>
            </div>
        </div>

        <!-- Table Card -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>PROJECT</th>
                        <th>CATEGORIES</th>
                        <th>DEVICE</th>
                        <th>TCN SCORE</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="projectsTableBody">
                    <!-- Projects injected via JS -->
                </tbody>
            </table>
            
            <div id="noDataMessage" class="no-data-msg" style="display:none; padding: 30px; text-align: center; color: #64748b;">
                No project found. We only list verified nodes.
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Total Crypto Network. All rights reserved.</p>
            <div class="footer-links">
                <a href="pages/about.html">About Us</a>
                <a href="pages/privacy.html">Privacy Policy</a>
                <a href="pages/disclaimer.html">Disclaimer</a>
            </div>
        </div>
    </footer>

    <script>
        // TCN Database (Updated with Device and Score)
        const ALL_PROJECTS = [
            { name: "Grass Network", sub: "DePIN Ecosystem", category: "Bandwidth", status: "Token Listed", link: "projects/grass.html", device: "💻 PC & 📱 Mobile", score: "⭐ 9.8 / 10" },
            { name: "Nodepay", sub: "AI Infrastructure", category: "Bandwidth", status: "No Token", link: "#", device: "💻 PC & 📱 Mobile", score: "⭐ 9.5 / 10" },
            { name: "Dawn Network", sub: "Decentralized Internet", category: "Bandwidth", status: "No Token", link: "#", device: "💻 PC Only", score: "⭐ 8.8 / 10" },
            { name: "Honeygain", sub: "Passive Data", category: "Bandwidth", status: "Token Listed", link: "#", device: "💻 PC & 📱 Mobile", score: "⭐ 9.0 / 10" },
            { name: "Titan Network", sub: "CDN & Storage", category: "Compute", status: "No Token", link: "#", device: "💻 PC & 📱 Mobile", score: "⭐ 9.2 / 10" },
            { name: "UpRock", sub: "Mobile AI Data", category: "Compute", status: "Token Listed", link: "#", device: "📱 Mobile Only", score: "⭐ 9.0 / 10" },
            { name: "Nodle", sub: "Bluetooth DePIN", category: "Mobile", status: "Token Listed", link: "#", device: "📱 Mobile Only", score: "⭐ 9.3 / 10" },
            { name: "Network3", sub: "AI & Bandwidth", category: "Bandwidth", status: "No Token", link: "#", device: "💻 PC Only", score: "⭐ 8.5 / 10" },
            { name: "Silencio", sub: "Noise Mapping", category: "Mobile", status: "No Token", link: "#", device: "📱 Mobile Only", score: "⭐ 8.7 / 10" },
            { name: "Acurast", sub: "Spare Phones", category: "Mobile", status: "No Token", link: "#", device: "📱 Mobile Only", score: "⭐ 8.4 / 10" }
        ];

        let currentFilter = 'All';
        let currentSubCategory = 'All';

        function getAvatarColor(name) {
            const colors = ['#0d9488', '#059669', '#2563eb', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        function renderTable() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('projectsTableBody');
            const noDataMsg = document.getElementById('noDataMessage');
            tbody.innerHTML = '';
            
            let visibleCount = 0;

            ALL_PROJECTS.forEach(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.category.toLowerCase().includes(searchVal);
                const matchesFilter = currentFilter === 'All' || p.status === currentFilter;
                const matchesSubCat = currentSubCategory === 'All' || p.category === currentSubCategory;

                if (matchesSearch && matchesFilter && matchesSubCat) {
                    visibleCount++;
                    const initial = p.name.charAt(0).toUpperCase();
                    const bgColor = getAvatarColor(p.name);
                    const targetLink = p.link ? p.link : '#';

                    // Token vs No Token Badge logic
                    let statusBadge = '';
                    if(p.status === "Token Listed") {
                        statusBadge = `<span style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-left: 8px;">Token Listed</span>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div class="project-cell">
                                <div class="project-avatar" style="background: ${bgColor}; width: 38px; height: 38px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700;">${initial}</div>
                                <div>
                                    <div class="project-name" style="display: flex; align-items: center;">${p.name} ${statusBadge}</div>
                                    <div class="project-sub" style="font-size: 12px; color: var(--text-muted);">${p.sub}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="category-pill" style="background: var(--th-bg); padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;">${p.category}</span></td>
                        <td style="font-weight: 600; font-size: 13px; color: var(--text-body);">${p.device}</td>
                        <td style="font-weight: 700; color: #0d9488;">${p.score}</td>
                        <td><a href="${targetLink}" class="btn-details" style="background: var(--accent-primary); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600;">View Details</a></td>
                    `;
                    tbody.appendChild(row);
                }
            });

            document.getElementById('projectCount').innerText = `Showing ${visibleCount} verified DePIN projects`;
            
            if(visibleCount === 0) {
                noDataMsg.style.display = "block";
            } else {
                noDataMsg.style.display = "none";
            }
        }

        function setCategory(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons .btn-filter').forEach(btn => {
                if(btn.tagName.toLowerCase() === 'button') btn.classList.remove('active');
            });
            button.classList.add('active');
            renderTable();
        }

        function setSubCategory(cat) {
            currentSubCategory = cat;
            renderTable();
        }

        function toggleTheme() {
            const body = document.body;
            const toggleBtn = document.getElementById('themeToggle');
            const currentTheme = body.getAttribute('data-theme');

            if (currentTheme === 'light') {
                body.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'light' ? '🌙' : '☀️';
            renderTable();
        };
    </script>
</body>
</html>
