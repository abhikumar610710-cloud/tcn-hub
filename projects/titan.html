<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Titan Network DePIN project guide, invite code AFD8CQ3U, decentralized edge routing, regional e-commerce data tasks, USDC & TNTIP rewards, device management, official channels, and node review on Total Crypto Hub.">
  <meta name="keywords" content="Titan Network, Titan DePIN, AFD8CQ3U, USDC, TNTIP, Edge Routing, Device Management, Community Missions, Total Crypto Hub">
  <meta name="theme-color" content="#08a86b">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <title>Titan Network — DePIN Project Guide | Total Crypto Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg: #f3fbf9;
      --surface: #ffffff;
      --surface-soft: #effcf8;
      --border: #c8eee1;
      --heading: #102344;
      --body: #29415c;
      --muted: #6c8299;
      --green: #08a86b;
      --green-dark: #008556;
      --green-light: #39e7a7;
      --green-soft: #e3fff3;
      --banner-start: #c9ffea;
      --banner-mid: #f2fff9;
      --banner-end: #c4fcef;
      --sidebar-width: 258px;
      --sponsor-height: 70px;
      --shadow: 0 12px 32px rgba(8, 168, 107, .09);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #081a20;
      --surface: #10272c;
      --surface-soft: #143139;
      --border: #254b4b;
      --heading: #f0fff9;
      --body: #d4eee5;
      --muted: #91b3ad;
      --green: #20d99a;
      --green-dark: #0cad78;
      --green-light: #5df0bd;
      --green-soft: #123e34;
      --banner-start: #0b2b27;
      --banner-mid: #0f3530;
      --banner-end: #0b2b27;
      --shadow: 0 14px 34px rgba(0, 0, 0, .24);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    article[id] { scroll-margin-top: calc(var(--sponsor-height) + 124px); }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--body);
      font-family: "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    /* TOP BRAND & PARTNER/SPONSOR HEADER BAR (MATCHING FIRST SCREENSHOT) */
    .sponsor-strip {
      position: sticky;
      top: 0;
      z-index: 200;
      min-height: var(--sponsor-height);
      display: flex;
      align-items: center;
      color: var(--heading);
      background: linear-gradient(95deg, #dffef2 0%, #f5fffb 52%, #dcfff1 100%);
      border-bottom: 1px solid #b7eed9;
      box-shadow: 0 3px 14px rgba(8, 168, 107, .07);
    }
    [data-theme="dark"] .sponsor-strip {
      background: linear-gradient(95deg, #0b2b27 0%, #0f3530 52%, #0b2b27 100%);
      border-bottom-color: #245f4d;
    }
    .sponsor-inner {
      width: 100%;
      max-width: 1800px;
      min-height: var(--sponsor-height);
      margin: auto;
      padding: 8px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-brand {
      min-width: 215px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }
    .header-logo {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      overflow: hidden;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle at 30% 25%, #5bffc8, var(--green) 65%, var(--green-dark));
      box-shadow: 0 3px 12px rgba(8, 168, 107, .22);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
    }
    .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .header-brand-name { display: block; color: var(--heading); font-size: 17px; font-weight: 800; line-height: 1.15; letter-spacing: -.45px; }
    .header-brand-subtitle { display: block; margin-top: 2px; color: var(--green-dark); font-size: 10.5px; font-weight: 700; }
    .header-brand-subtitle b { color: var(--green-dark); font-weight: 800; }
    [data-theme="dark"] .header-brand-subtitle, [data-theme="dark"] .header-brand-subtitle b { color: var(--green-light); }

    .sponsor-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      margin-left: auto;
    }
    .btn-header-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid #96dfd0;
      background: #ffffff;
      color: var(--heading);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: .18s ease;
    }
    .btn-header-outline:hover { border-color: var(--green); background: var(--green-soft); }
    [data-theme="dark"] .btn-header-outline { background: var(--surface); border-color: #256650; }

    .btn-header-solid {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #10b978, var(--green-dark));
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(8, 168, 107, .24);
      transition: transform .18s ease;
    }
    .btn-header-solid:hover { transform: translateY(-1px); }

    .header-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #96dfd0;
      background: #ffffff;
      color: var(--heading);
      display: grid;
      place-items: center;
      font-size: 14px;
      text-decoration: none;
      transition: .18s ease;
    }
    .header-circle-btn:hover { border-color: var(--green); color: var(--green); }
    [data-theme="dark"] .header-circle-btn { background: var(--surface); border-color: #256650; }

    /* LEFT SIDEBAR (MATCHING FIRST SCREENSHOT WITH ALL TOOLS) */
    .sidebar {
      position: fixed;
      z-index: 150;
      inset: var(--sponsor-height) auto 0 0;
      width: var(--sidebar-width);
      height: calc(100vh - var(--sponsor-height));
      height: calc(100dvh - var(--sponsor-height));
      display: flex;
      flex-direction: column;
      padding: 16px 14px 16px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: transform .25s ease;
    }
    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .side-nav { display: grid; gap: 5px; flex-shrink: 0; }
    .side-link {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 6px 12px;
      color: var(--body);
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      transition: .18s ease;
    }
    .side-link:hover { background: var(--surface-soft); border-color: var(--border); }
    .side-link.active {
      color: #ffffff;
      background: linear-gradient(135deg, #10b978, var(--green-dark));
      box-shadow: 0 5px 14px rgba(8, 168, 107, .24);
    }
    .nav-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      font-size: 14px;
      color: var(--green-dark);
      background: var(--green-soft);
    }
    .side-link.active .nav-icon {
      color: #ffffff;
      background: rgba(255, 255, 255, .2);
    }
    [data-theme="dark"] .nav-icon { color: var(--green-light); }
    [data-theme="dark"] .side-link.active .nav-icon { color: #ffffff; }
    .nav-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-spacer { flex: 1 0 14px; min-height: 14px; }
    .side-promo {
      margin: 12px 2px 10px;
      padding: 16px 13px;
      flex-shrink: 0;
      text-align: center;
      border-radius: 18px;
      border: 1px solid #b4edd6;
      background: linear-gradient(155deg, #dffef2 0%, #f5fffb 100%);
    }
    [data-theme="dark"] .side-promo { background: linear-gradient(155deg, var(--surface-soft), var(--surface)); border-color: #255c49; }
    .promo-gift { margin-bottom: 6px; font-size: 28px; }
    .side-promo h3 { margin: 0 0 5px; color: var(--heading); font-size: 13px; line-height: 1.35; font-weight: 800; }
    .side-promo p { margin: 0 0 11px; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
    .promo-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 999px; color: #ffffff; background: linear-gradient(135deg, #10b978, var(--green-dark)); text-decoration: none; font-size: 11px; font-weight: 800; box-shadow: 0 4px 12px rgba(8, 168, 107, .22); }

    .support-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 2px;
      padding: 10px 12px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      text-decoration: none;
    }
    .support-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--green-dark); background: var(--green-soft); border: 1px solid var(--border); font-size: 15px; }
    [data-theme="dark"] .support-icon { color: var(--green-light); }
    .support-card strong { display: block; color: var(--heading); font-size: 11px; }
    .support-card span:last-child { display: block; margin-top: 2px; color: var(--green); font-size: 10px; font-weight: 800; }

    /* MAIN COLUMN + TOPBAR */
    .main-column { min-height: 100vh; margin-left: var(--sidebar-width); }
    .topbar {
      position: sticky;
      top: var(--sponsor-height);
      z-index: 100;
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 28px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .mobile-menu-btn { display: none; width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 12px; color: var(--heading); background: var(--surface); }
    .btn-back-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 35px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 11px;
      font-weight: 800;
      transition: .18s ease;
    }
    [data-theme="dark"] .btn-back-pill { color: var(--green-light); }
    .btn-back-pill:hover { background: var(--green); color: #ffffff; }

    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .breadcrumb a {
      text-decoration: none;
      color: var(--green-dark);
      transition: color .18s;
    }
    [data-theme="dark"] .breadcrumb a { color: var(--green-light); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span.current { color: var(--heading); font-weight: 800; }

    .topbar-spacer { flex: 1; }
    .icon-btn {
      min-height: 38px;
      width: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--heading);
      background: var(--surface);
      font-size: 16px;
      box-shadow: 0 3px 9px rgba(8, 168, 107, .05);
    }
    .icon-btn:hover { border-color: var(--green); color: var(--green); }

    /* FULL-WIDTH SHORTCUT JUMP BAR */
    .jump-strip {
      position: sticky;
      top: calc(var(--sponsor-height) + 60px);
      z-index: 95;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
    }
    .jump-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 8px clamp(16px, 2.4vw, 32px);
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .jump-inner::-webkit-scrollbar { display: none; }
    .jump-tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--heading);
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      transition: .16s ease;
    }
    .jump-tab:hover, .jump-tab.active {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      border-color: var(--green);
      color: #ffffff;
    }

    /* FULL-WIDTH CONTAINER */
    main {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 22px clamp(16px, 2.4vw, 32px) 42px;
    }

    /* MINT-GREEN & WHITE HERO BANNER */
    .project-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(305px, .82fr);
      align-items: center;
      gap: 22px;
      padding: 24px 28px;
      border: 1px solid #96ecd0;
      border-radius: 22px;
      background:
        radial-gradient(circle at 88% 20%, rgba(8, 168, 107, .22), transparent 34%),
        linear-gradient(110deg, var(--banner-start) 0%, var(--banner-mid) 52%, var(--banner-end) 100%);
      box-shadow: var(--shadow);
    }
    [data-theme="dark"] .project-hero { border-color: #215d4c; }
    .hero-identity {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .hero-logo-box {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 2px solid var(--green);
      box-shadow: 0 8px 20px rgba(8, 168, 107, .18);
      color: var(--green-dark);
      font-size: 24px;
      font-weight: 800;
    }
    [data-theme="dark"] .hero-logo-box { color: var(--green-light); }
    .hero-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .3px;
      background: var(--surface);
      color: var(--green-dark);
      border: 1px solid #96ecd0;
    }
    [data-theme="dark"] .badge-pill { background: var(--green-soft); color: var(--green-light); border-color: #256f55; }

    .hero-title-group h1 {
      margin: 0 0 6px;
      color: var(--heading);
      font-size: clamp(24px, 2.7vw, 35px);
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: -.8px;
    }
    .hero-title-group p {
      margin: 0;
      color: var(--body);
      font-size: 13px;
      line-height:
