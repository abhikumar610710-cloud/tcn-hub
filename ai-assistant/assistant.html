<div id="tcn-ai-assistant">
  <div class="tcn-ai-character-area">
    <button
      type="button"
      id="tcnAiRobot"
      class="tcn-ai-character is-standing"
      aria-label="Open TCN AI Assistant"
      aria-expanded="false"
    >
      <img
        class="tcn-ai-robot-head"
        src="ai-assistant/assets/TCNAI.png"
        data-tcn-image="ai-assistant/assets/TCNAI.png"
        alt="TCN AI Assistant Robot"
      />
    </button>
  </div>

  <section
    class="tcn-ai-window"
    id="tcnAiWindow"
    aria-label="TCN AI Assistant Chat"
    aria-hidden="true"
  >
    <header class="tcn-ai-header">
      <div class="tcn-ai-header-avatar">
        <img
          src="ai-assistant/assets/TCNAI.png"
          data-tcn-image="ai-assistant/assets/TCNAI.png"
          alt="TCN AI"
        />
      </div>

      <div class="tcn-ai-header-info">
        <strong>TCN AI Assistant</strong>
        <span>
          <i class="tcn-ai-status-dot"></i>
          Online
        </span>
      </div>

      <button
        type="button"
        id="tcnAiClose"
        class="tcn-ai-close"
        aria-label="Close chat"
      >×</button>
    </header>

    <div
      class="tcn-ai-messages"
      id="tcnAiMessages"
      aria-live="polite"
    ></div>

    <div class="tcn-ai-suggestions">
      <button type="button" data-question="What is TCN?">What is TCN?</button>
      <button type="button" data-question="Tell me about Total Crypto Hub.">About TCN</button>
      <button type="button" data-question="Tell me about DePIN projects.">DePIN</button>
      <button type="button" data-question="Tell me about airdrops.">Airdrops</button>
      <button type="button" data-question="Tell me about TCN community.">Community</button>
      <button type="button" data-question="What services does TCN provide?">Services</button>
    </div>

    <form class="tcn-ai-form" id="tcnAiForm">
      <input
        type="text"
        id="tcnAiInput"
        placeholder="Ask about TCN..."
        autocomplete="off"
        maxlength="500"
        aria-label="Type your message"
      />

      <button type="submit" aria-label="Send message">➤</button>
    </form>

    <div class="tcn-ai-footer">
      Powered by Total Crypto Network
    </div>
  </section>
</div>
