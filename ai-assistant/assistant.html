
<div id="tcn-ai-assistant">

  <!-- AI Girl Character -->
  <div class="tcn-ai-character-area">

    <button
      type="button"
      id="tcnAiRobot"
      class="tcn-ai-character is-standing"
      aria-label="Open TCN AI Assistant"
      aria-expanded="false"
    >
      <img
        class="tcn-ai-girl tcn-ai-girl-standing"
        data-tcn-image="assets/ai-girl-standing.png"
        alt="TCN AI Assistant standing and smiling"
      />

      <img
        class="tcn-ai-girl tcn-ai-girl-sitting"
        data-tcn-image="assets/ai-girl-sitting.png"
        alt="TCN AI Assistant sitting and smiling"
      />

      <span class="tcn-ai-character-glow"></span>
    </button>

    <div class="tcn-ai-greeting" id="tcnAiGreeting">
      Hello! 👋<br />
      How can I help you today?
    </div>

    <div class="tcn-ai-status">
      <span class="tcn-ai-status-dot"></span>
      TCN AI Assistant
    </div>

  </div>

  <!-- Chat Popup -->
  <section
    class="tcn-ai-window"
    id="tcnAiWindow"
    aria-label="TCN AI Assistant Chat"
    aria-hidden="true"
  >

    <header class="tcn-ai-header">

      <div class="tcn-ai-header-avatar">
        <img
          data-tcn-image="assets/ai-girl-standing.png"
          alt="TCN AI"
        />
      </div>

      <div class="tcn-ai-header-info">
        <strong>TCN AI Assistant</strong>
        <span>
          <i class="tcn-ai-status-dot"></i>
          Online
        </span>
      </div>

      <button
        type="button"
        id="tcnAiClose"
        class="tcn-ai-close"
        aria-label="Close chat"
      >×</button>

    </header>

    <div class="tcn-ai-welcome">
      <strong>Hello! 👋</strong>
      <p>
        I'm your TCN AI Assistant!
        I can help you with Total Crypto Hub
        and Total Crypto Network related information. 🚀
      </p>
    </div>

    <div
      class="tcn-ai-messages"
      id="tcnAiMessages"
      aria-live="polite"
    ></div>

    <div class="tcn-ai-suggestions">

      <button type="button" data-question="What is TCN?">
        What is TCN?
      </button>

      <button type="button" data-question="Tell me about Total Crypto Hub.">
        About Total Crypto Hub
      </button>

      <button type="button" data-question="Tell me about DePIN projects.">
        DePIN Projects
      </button>

      <button type="button" data-question="Tell me about TCN community.">
        TCN Community
      </button>

      <button type="button" data-question="What services does TCN provide?">
        TCN Services
      </button>

    </div>

    <form class="tcn-ai-form" id="tcnAiForm">

      <input
        type="text"
        id="tcnAiInput"
        placeholder="Type your message..."
        autocomplete="off"
        maxlength="500"
        aria-label="Type your message"
      />

      <button type="submit" aria-label="Send message">
        ➤
      </button>

    </form>

    <div class="tcn-ai-footer">
      Powered by Total Crypto Network
    </div>

  </section>

</div>
