
<div id="tcn-ai-assistant">
  <!-- Floating AI Robot -->
  <button
    class="tcn-ai-robot"
    id="tcnAiRobot"
    type="button"
    aria-label="Open TCN AI Assistant"
    title="Talk to TCN AI"
  >
    <span class="tcn-robot-glow"></span>
    <span class="tcn-robot-face">
      <span class="tcn-robot-eye tcn-eye-left"></span>
      <span class="tcn-robot-eye tcn-eye-right"></span>
      <span class="tcn-robot-smile"></span>
    </span>
    <span class="tcn-robot-status"></span>
  </button>

  <!-- Welcome and Chat Window -->
  <section
    class="tcn-ai-window"
    id="tcnAiWindow"
    aria-label="TCN AI chat"
    aria-hidden="true"
  >
    <header class="tcn-ai-header">
      <div class="tcn-ai-brand">
        <div class="tcn-ai-mini-logo">✦</div>
        <div>
          <h2>Total Crypto Hub</h2>
          <p>by Total Crypto Network</p>
        </div>
      </div>
      <button
        class="tcn-ai-close"
        id="tcnAiClose"
        type="button"
        aria-label="Close assistant"
      >×</button>
    </header>

    <div class="tcn-ai-content">
      <div class="tcn-ai-welcome">
        <div class="tcn-ai-avatar">
          <span class="tcn-avatar-eye"></span>
          <span class="tcn-avatar-eye"></span>
          <span class="tcn-avatar-smile"></span>
        </div>

        <span class="tcn-ai-online">● AI ASSISTANT ONLINE</span>

        <h3>Welcome! 👋</h3>
        <p>
          नमस्ते! Total Crypto Hub में आपका स्वागत है।
          आज मैं आपकी किस प्रकार सहायता कर सकता हूँ?
        </p>
      </div>

      <div class="tcn-ai-suggestions">
        <button type="button" data-question="DePIN Projects क्या हैं?">
          🌐 DePIN Projects
        </button>
        <button type="button" data-question="मुझे Airdrops के बारे में बताइए।">
          🎁 Airdrops & Campaigns
        </button>
        <button type="button" data-question="Wallets और Exchanges के बारे में बताइए।">
          👛 Wallets & Exchanges
        </button>
        <button type="button" data-question="Token Checker कैसे इस्तेमाल करें?">
          🔍 Token Checker
        </button>
      </div>

      <div
        class="tcn-ai-messages"
        id="tcnAiMessages"
        aria-live="polite"
      ></div>
    </div>

    <form class="tcn-ai-input-area" id="tcnAiForm">
      <input
        id="tcnAiInput"
        type="text"
        placeholder="अपना सवाल यहाँ लिखें..."
        autocomplete="off"
        maxlength="1000"
      />
      <button type="submit" aria-label="Send message">➤</button>
    </form>

    <footer class="tcn-ai-footer">
      Powered by Total Crypto Network
    </footer>
  </section>
</div>
